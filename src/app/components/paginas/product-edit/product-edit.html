<div class="product-edit">
  <div class="product-edit__container">
    <div class="product-edit__header">
      <h1>Edit Product</h1>
    </div>

    <form [formGroup]="productForm" (ngSubmit)="saveProduct()" class="product-edit__form">
      <div class="product-edit__form-group">
        <label for="name" class="product-edit__label">Name:</label>
        <input id="name" type="text" formControlName="name" class="product-edit__input" />
        <div
          *ngIf="productForm.get('name')?.invalid && (productForm.get('name')?.dirty || productForm.get('name')?.touched)"
          class="product-edit__error">
          Name is required.
        </div>
      </div>

      <div class="product-edit__form-group">
        <label for="description" class="product-edit__label">Description:</label>
        <textarea id="description" formControlName="description" class="product-edit__textarea"></textarea>
        <div
          *ngIf="productForm.get('description')?.invalid && (productForm.get('description')?.dirty || productForm.get('description')?.touched)"
          class="product-edit__error">
          Description is required.
        </div>
      </div>

      <div class="product-edit__form-group">
        <label for="price" class="product-edit__label">Price:</label>
        <input id="price" type="number" formControlName="price" class="product-edit__input" />
        <div
          *ngIf="productForm.get('price')?.invalid && (productForm.get('price')?.dirty || productForm.get('price')?.touched)"
          class="product-edit__error">
          Price is required and must be a positive number.
        </div>
      </div>

      <div class="product-edit__form-group">
        <label for="stock" class="product-edit__label">Stock:</label>
        <input id="stock" type="number" formControlName="stock" class="product-edit__input" />
        <div
          *ngIf="productForm.get('stock')?.invalid && (productForm.get('stock')?.dirty || productForm.get('stock')?.touched)"
          class="product-edit__error">
          Stock is required and must be a positive number.
        </div>
      </div>

      <div class="product-edit__form-group">
        <label for="category" class="product-edit__label">Category:</label>
        <select id="category" formControlName="category" class="product-edit__select">
          <option [ngValue]="null" disabled>Select a category</option>
          <option *ngFor="let category of categories" [ngValue]="category">{{ category.name }}</option>
        </select>
        <div
          *ngIf="productForm.get('category')?.invalid && (productForm.get('category')?.dirty || productForm.get('category')?.touched)"
          class="product-edit__error">
          Category is required.
        </div>
      </div>

      <div class="product-edit__actions">
        <button type="submit" class="boton boton--importancia-primaria" [disabled]="!productForm.valid">
          Save Changes
        </button>
        <button type="button" class="boton boton--funcion-alternativa" (click)="cancel()">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
