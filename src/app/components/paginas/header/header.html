<header class="header">
  <div class="header__container">
    <img src="/img/logo.png" alt="VetandGo ADM" class="header__logo">
    <div class="header__title">
      <h1>VetandGo ADM</h1>
    </div>
    <nav class="header__nav nav">
      <ul class="nav__list">
        <li class="nav__item">
          <a routerLink="/" class="nav__link">
            Inicio
          </a>
        </li>
        <li class="nav__item">
          <a routerLink="/products" class="nav__link">
            Products
          </a>
        </li>
        <li class="nav__item">
          <a routerLink="/categories" class="nav__link">
            Categories
          </a>
        </li>
      </ul>
    </nav>
    @if (auth.isLoggedIn()) {
      <div class="header__user">
        <span class="header__username">{{ auth.getUsername() }}</span>
        <button class="boton boton--funcion-peligrosa boton--importancia-primaria boton--size-sm" (click)="logout()">
          Cerrar sesión
        </button>
      </div>
    }
  </div>
</header>
