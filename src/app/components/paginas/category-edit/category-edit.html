<div class="category-edit">
  <div class="category-edit__container">
    <div class="category-edit__header">
      <h1 class="category-edit__title">Editar Categoría</h1>
    </div>

    <form class="category-edit__form" (ngSubmit)="save()">
      <div class="category-edit__field">
        <label for="name" class="category-edit__label">Nombre</label>
        <input type="text" id="name" name="name" class="category-edit__input" [(ngModel)]="category.name" required />
      </div>

      <div class="category-edit__field">
        <label for="description" class="category-edit__label">Descripción</label>
        <textarea id="description" name="description" class="category-edit__textarea" [(ngModel)]="category.description"
          rows="4" required></textarea>
      </div>

      <div class="category-edit__actions">
        <button type="button" class="boton boton--funcion-normal boton--importancia-secundaria"
          (click)="goBack()">Cancelar</button>
        <button type="submit" class="boton boton--funcion-alternativa boton--importancia-primaria">Guardar</button>
      </div>
    </form>
  </div>
</div>
