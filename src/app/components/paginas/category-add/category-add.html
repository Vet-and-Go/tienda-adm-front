<div class="category-add">
  <div class="category-add__container">
    <div class="category-add__header">
      <h1 class="category-add__title">Nueva Categoría</h1>
    </div>

    <form class="category-add__form" (ngSubmit)="saveCategory()">
      <div class="category-add__field">
        <label for="name" class="category-add__label">Nombre</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="category-add__input"
          [(ngModel)]="category.name" 
          required
        />
      </div>

      <div class="category-add__field">
        <label for="description" class="category-add__label">Descripción</label>
        <textarea 
          id="description" 
          name="description" 
          class="category-add__textarea"
          [(ngModel)]="category.description" 
          rows="4"
          required
        ></textarea>
      </div>

      <div class="category-add__actions">
        <button type="button" class="category-add__btn category-add__btn--cancel" (click)="cancel()">
          Cancelar
        </button>
        <button type="submit" class="category-add__btn category-add__btn--save">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
